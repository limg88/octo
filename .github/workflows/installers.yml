name: Installatori
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A tag is the version: the installed app compares its own with the one of the release.
      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        working-directory: apps/desktop
        run: npm pkg set version="${GITHUB_REF_NAME#v}"
      - run: pnpm dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: octo-${{ matrix.os }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
          if-no-files-found: error

  # Publishes what was built as the release of the tag, with the checksum of every file: an
  # installed Octo installs only a file whose checksum is in that list.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Checksums
        working-directory: files
        run: sha256sum * > SHA256SUMS
      - name: Release
        working-directory: files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" * --repo "$GITHUB_REPOSITORY" --title "Octo ${GITHUB_REF_NAME#v}" --generate-notes
