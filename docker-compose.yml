# A local Postgres used only by the tests of the DWSI connector: each test creates and drops its
# own fake warehouse in it. Nothing of the app runs here.
services:
  test-db:
    image: postgres:17
    environment:
      POSTGRES_USER: octo_owner
      POSTGRES_PASSWORD: octo-test-only
      POSTGRES_DB: octo_test
    ports:
      - '127.0.0.1:5460:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U octo_owner -d octo_test']
      interval: 2s
      timeout: 2s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
