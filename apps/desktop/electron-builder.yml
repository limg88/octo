appId: it.octo.desktop
productName: Octo
directories:
  output: release
files:
  - dist/**
  - package.json
# Everything is bundled into dist/: no node_modules travel with the app.
npmRebuild: false
# The names Octo looks for when it updates itself: Octo-<version>-<system>-<arch>.<extension>.
mac:
  # The interpreter for the calculations Claude runs inside its fence (scripts/fetch-python.mjs).
  extraResources:
    - from: resources/python/mac-${arch}
      to: python
    # The deliverables with a script a project starts its own copy from.
    - from: resources/deliverable
      to: deliverable
    # The kinds of the catalog of deliverables: what each is and how it is written.
    - from: resources/catalogo
      to: catalogo
  category: public.app-category.productivity
  artifactName: Octo-${version}-mac-${arch}.${ext}
  target:
    # The disk image is what a person installs from; the archive is what Octo replaces itself with.
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
win:
  # On Windows Claude computes inside WSL2: the interpreter shipped is the one for Linux.
  extraResources:
    - from: resources/python/linux-x64
      to: python-linux
    - from: resources/deliverable
      to: deliverable
    - from: resources/catalogo
      to: catalogo
  artifactName: Octo-${version}-win-${arch}.${ext}
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: true
  perMachine: false
